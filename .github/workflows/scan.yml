name: Scan and publish

on:
  schedule:
    # Twice each trading day, right after each 4-hour candle closes (New York time):
    #   1:50 PM, after the 9:30-1:30 candle, and 4:20 PM, after the 1:30-4:00 candle.
    # Alpaca's free plan serves full-market data once it's 15 minutes old, so each scan
    # runs about 20 minutes after its candle closes. The scan ignores candles that
    # haven't closed yet, so a late start never scores a half-formed candle.
    # GitHub cron runs in UTC, so each time is listed for both daylight time
    # (EDT, UTC-4) and standard time (EST, UTC-5). The "gate" job below
    # skips whichever set doesn't match today's New York offset, and skips
    # NYSE holidays. If you change these, update SLOTS in docs/index.html.
    - cron: "50 17 * * 1-5"         # EDT: 13:50
    - cron: "20 20 * * 1-5"         # EDT: 16:20
    - cron: "50 18 * * 1-5"         # EST: 13:50
    - cron: "20 21 * * 1-5"         # EST: 16:20
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab
  push:                   # republish the site when you edit the page
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)
          today=$(TZ=America/New_York date +%F)
          case "$SCHED" in
            "50 17 * * 1-5"|"20 20 * * 1-5") want="-0400" ;;
            *) want="-0500" ;;
          esac
          # NYSE full-day holidays
          holidays="2026-11-26 2026-12-25 2027-01-01 2027-01-18 2027-02-15 2027-03-26 2027-05-31 2027-06-18 2027-07-05 2027-09-06 2027-11-25 2027-12-24"
          if [ "$offset" != "$want" ]; then
            echo "Skipping: this time slot is for UTC$want, New York is UTC$offset today."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif echo " $holidays " | grep -q " $today "; then
            echo "Skipping: $today is a market holiday."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Market-hours scan for $today."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: gate
    # Manual runs ("Run workflow") always scan; scheduled runs only when the gate allows.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run scan
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          CALLS_PER_MINUTE: ${{ vars.CALLS_PER_MINUTE || '8' }}
        run: node scripts/scan.mjs

      # Adds this scan's breakouts to the track record (docs/performance.html).
      # Daily closes are refreshed after every scan with Alpaca (a single call), or once a day
      # after the close with Twelve Data (one call per stock still being tracked).
      - name: Track breakout performance
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          CALLS_PER_MINUTE: ${{ vars.CALLS_PER_MINUTE || '8' }}
          EVENT: ${{ github.event_name }}
        run: |
          hour=$(TZ=America/New_York date +%-H)
          if [ -n "$ALPACA_API_KEY_ID" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$hour" -ge 16 ]; then
            node scripts/track.mjs --prices
          else
            node scripts/track.mjs
          fi

      - name: Save results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/summary.json docs/data/breakouts.json
          if git diff --cached --quiet; then
            echo "No change in results."
            exit 0
          fi
          git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push

  deploy:
    needs: scan
    # Runs after a successful scan, or on its own when you push a page edit.
    # If a scan fails or is skipped, the previous results stay online.
    if: always() && (needs.scan.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}   # the branch head, including the results just committed

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
